<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--يتم تقسيم المشروع ل ثلاث اقسام-->
    <div class="crud">
        <!--اول قسم العنوان-->
        <div class="head">
            <h2>crud</h2>
            <p>product management system</p>
        </div>
<!--القسسم الثاني المدخلات-->
        <div class="inputs">
            <input placeholder="title" type="text" id="title">
            <div class="price">
                <input onkeyup="getTotal()" type="number" placeholder="price" id="price">
                <input onkeyup="getTotal()" type="number" placeholder="taxes" id="taxes">
                <input onkeyup="getTotal()" type="number" placeholder="ads" id="ads">    
                <input onkeyup="getTotal()" type="number" placeholder="discount" id="discount">
                <small id="total"></small>
            </div>
            <input placeholder="count" type="number" id="count">
            <input placeholder="category" type="text" id="category">
            <button id="submit">create</button>

        </div>
<!-- القسم الثالث المخرجات-->
        <div class="outputs">
            <div class="searchBlock">
                <input onkeyup="searchData(value)" type="text" placeholder="search" id="search">
                <div class="btnSearch">
                    <button onclick="getSearchMood(this.id)" id="search-title">search by title</button>
                <button onclick="getSearchMood(this.id)" id="search-category">search by category </button>
                </div>
            </div>
            <div id="deleteAll">
                
            </div>
            <table>
                <tr>
                    <th>id</th>
                    <th>title</th>
                    <th>price</th>
                    <th>taxes</th>
                    <th>ads</th>
                    <th>discount</th>
                    <th>total</th>
                    <th>category</th>
                    <th><button id="update">update</button></th>
                    <th><button id="delete">delete</button></th>
                </tr>
                <tbody id="tbody">

                </tbody>
            </table>

        </div>

    </div>
    <script src="main.js"></script>
</body>
</html>
